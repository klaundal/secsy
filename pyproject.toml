[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "secsy"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secsy = [
    "data/natural_earth_npz/*.npz",
]

[tool.setuptools_scm]
